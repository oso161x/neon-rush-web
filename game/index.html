<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEON RUSH — Crystal Run</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050510;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #wrap {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="1280" height="720"></canvas>
      <p id="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
